# This is a simulator configuation table
#

# feature on or off, true or 1 is ON
# xxx_feature           true
# xxx_feature2          0

sm_log_level            3

# mid_perf(nextgen) 日志级别（三档互斥）：
#   0 -> 只打印单指令整体信息(launch/done/summary 等指令级生命周期)
#   1 -> 只打印 engine/resource 内部的 req / subcmd 细粒度信息
#        (SUB/MAC/L1RD/L1BUF accept/reject/resp 等)，不打印 CoreTop
#   2 -> 只打印 CoreTop 的 issue/accepted/response，不打印 engine/resource 内部信息
sm_perf_log_level       0

sm_use_cmodel           true
sm_rmsnorm_eps          0x358637bd

sm_mdp32_dp_width       28
sm_fdp16_dp_width       34
sm_fdp64_dp_width       36


sm_error_exit           false
sm_sys_pa_en            false

sm_perf_mode            false  #perf
sm_func_mode            true  #func
## perf true, func false  -> perf count
## perf true, func true  -> perf count + func cal
## perf false, func true -> func cal
## perf false, func false ->illegal

# mid_perf(nextgen mid 模型)开关：仅 SM_PERF_MODE=true 时生效。
# true  -> 由 mid_perf 的 CoreTop/TensorModel/VAE/DMA + L1BUF/MIF NoC 接管执行
# false -> 走旧版 WDS/带宽估算性能模型
sm_mid_perf_mode       false

# 单 die 4-core 正式集成开关（仅 SM_PERF_MODE && SM_MID_PERF_MODE 生效）：
# true  -> sm_main 创建并驱动 SingleDieTop，每核 CoreTop 走 die 级
#          remote/DDR 闭环（src MIF->SoC NoC->目标核/DDR mem->返回）
# false -> 每核 CoreTop 内嵌 soc_noc stub 自回环（本地单核/调试用）
sm_use_die_top         false

sm_threads_num          32
